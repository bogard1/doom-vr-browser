name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: .tools/emsdk
          key: emsdk-${{ runner.os }}

      - name: Cache engine build directory
        uses: actions/cache@v4
        with:
          path: build
          key: engine-build-${{ runner.os }}-${{ hashFiles('patches/engine/**', 'scripts/build-wasm.sh', '.gitmodules') }}
          restore-keys: |
            engine-build-${{ runner.os }}-

      - name: Set up Emscripten SDK
        run: ./scripts/setup.sh

      - name: Apply engine patches
        run: ./scripts/apply-engine-patches.sh

      - name: Build engine WASM
        run: ./scripts/build-wasm.sh

      - name: Copy engine artifacts into web/public
        run: |
          mkdir -p web/public/engine
          cp build/wasm/lzdoom.js build/wasm/lzdoom.wasm build/wasm/lzdoom.pk3 build/wasm/lz_game_support.pk3 web/public/engine/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        env:
          VITE_BASE_PATH: /doom-vr-browser/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
